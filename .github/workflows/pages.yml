name: Web app (GitHub Pages)

# Builds the Pressdock app (desktop/) as a web app and publishes it to
# https://<owner>.github.io/pressdock/ . One-time setup in the repository:
# Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx vite build --outDir dist-pages
        env:
          PRESSDOCK_BASE: /pressdock/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: desktop/dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
